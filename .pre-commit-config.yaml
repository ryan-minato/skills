# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      # Runs first, on `git commit` only: needs staged content and the
      # author email. `just check` and CI skip it with SKIP=commit-safety.
      - id: commit-safety
        name: staged-change safety gate (author email, credentials, layers)
        entry: python3 scripts/check_commit_safety.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: mixed-line-ending
        args: [ "--fix=auto" ]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: secret scanning with detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        name: secret and PII scanning with gitleaks (.gitleaks.toml)
        args: ['--config', '.gitleaks.toml']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        files: ^(scripts|skills/[^/]+/[^/]+/scripts)/.*\.py$
      - id: ruff-format
        files: ^(scripts|skills/[^/]+/[^/]+/scripts)/.*\.py$

  - repo: local
    hooks:
      - id: validate-skills
        name: validate skill layout and harness consistency
        entry: python3 scripts/validate_skills.py
        language: system
        pass_filenames: false
        always_run: true
      - id: validate-harness
        name: validate harness synchronization
        entry: python3 scripts/validate_harness.py
        language: system
        pass_filenames: false
        always_run: true
