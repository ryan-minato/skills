schema: skill-change

# Conventions live in the repository harness; this block points, it does
# not restate. AGENTS.md is the entrypoint, .agents/knowledge/spec-workflow.md
# the specification rules, .agents/knowledge/skill-quality.md the skill bar.
context: |
  This repository is a library of Agent Skills (skills/<catalog>/<skill>/)
  that other projects install by copying a skill directory. Read AGENTS.md
  first. Specification rules: .agents/knowledge/spec-workflow.md. Skill
  quality bar: .agents/knowledge/skill-quality.md. Domains: one per public
  skill at specs/<catalog>/<skill-name>. Changes to the repository itself
  (environment, harness, tooling, documents) are skip_specs changes with
  no domain. Never backfill specs for skills the change does not touch.

# Artifact rules live in openspec/schemas/skill-change/schema.yaml (the
# project schema); this file carries only the guidance the CLI injects into
# the apply and archive operations.

operations:
  apply:
    guidance:
      - Work on the change's branch (<type>/<slug>, slug = change name); see .agents/knowledge/github-workflow.md.
      - When the implementation must deviate from the spec, stop and revise the change first.
  archive:
    guidance:
      - Archive inside the pull request before it is marked ready, by hand or by applying the spec/archive label (see .agents/knowledge/spec-workflow.md, Archive executor); main never holds an unarchived change.
      - Never tick a task that is not done; a fully ticked tasks.md is what the archive consumes, and the label bot refuses every change of the pull request while any has an open task.
      - Run `just spec-validate` after archiving; `just spec-check` reproduces the checks / spec verdict.
