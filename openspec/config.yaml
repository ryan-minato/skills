schema: skill-change

# Conventions live in the repository harness; this file points, it never
# restates. Artifact rules live in the project schema
# (openspec/schemas/skill-change/schema.yaml); this file carries only the
# context and the apply and archive guidance the CLI injects.
context: |
  This repository is a library of Agent Skills (skills/<catalog>/<skill>/)
  that other projects install by copying a skill directory. Read AGENTS.md
  first. Domains, repository changes, and the lifecycle:
  .agents/knowledge/spec-workflow.md. Skill quality bar:
  .agents/knowledge/skill-quality.md.

operations:
  apply:
    guidance:
      - Work on the change's branch (.agents/knowledge/github-workflow.md, Branches and merging).
      - Tick tasks and handle a deviation from the spec as .agents/knowledge/spec-workflow.md, Lifecycle, says.
  archive:
    guidance:
      - Archive only with `just spec-changes archive --base origin/main --head HEAD`, never the generated archive skill.
      - When to archive and what follows: .agents/knowledge/spec-workflow.md, Archive executor and the freeze.
