# Ruff configuration for repository scripts, skill-bundled scripts, and the
# script assets the meta and sdd skills deposit into targets.
# The explicit `select` keeps local and pre-commit runs on one rule set; the
# line length matches .editorconfig. BLE001 and S110 hold management code to
# the rule that no handler hides a failure (.agents/knowledge/skill-quality.md,
# Management code); a justified exception carries `# noqa: <rule>` and its
# reason. SIM105 is off there because it rewrites a flagged handler into
# `contextlib.suppress`, which neither rule sees. Skills' own scripts/
# follow the Scripts rules instead.
line-length = 120
target-version = "py310"

# Floors promised by each skill's SKILL.md `compatibility` field.
[per-file-target-version]
"skills/core/ryan-minato-skills-installing/scripts/*.py" = "py39"
"skills/core/sensitivity-check/scripts/*.py" = "py39"
"skills/meta/meta-git-branching/scripts/*.py" = "py39"
"skills/meta/meta-github-workflow/scripts/*.py" = "py39"
"skills/meta/meta-gitlab-workflow/scripts/*.py" = "py39"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE001", "S110"]

[lint.per-file-ignores]
"skills/*/*/scripts/**/*.py" = ["BLE001", "S110"]
"!skills/*/*/scripts/**/*.py" = ["SIM105"]
