name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: pr / policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate pull request policy
        run: python3 scripts/check_pr_policy.py --event "$GITHUB_EVENT_PATH"
