# .github/workflows/spec-labels.yml — keeps the labels of every pull request
# that follow from its OpenSpec changes:
#
# - `spec/approved`, the maintainer's approval of the approval package
#   (.agents/knowledge/spec-workflow.md, `## Approval gates`):
#   `scripts/spec_approval.ts` records it in one comment when the maintainer
#   adds the label, and withdraws it when the package changes after the
#   recorded commit, when a person removes it, or when no valid record answers
#   it; `just spec-approval <n>` prints the same decision without writing;
# - `spec/archived` | `spec/unarchived` and `spec/not-started` |
#   `spec/in-progress` | `spec/done` from the related changes. A pull request
#   with no related change carries none of them.
#
# `scripts/spec_changes.ts` is this repository's own management script, not a
# copy that must match the openspec-workflow skill's script.
#
# This is a privileged workflow (.agents/knowledge/github-checks.md): it runs
# main's copy of this file and of the scripts with a token that can label a
# pull request from a fork. It stays within these bounds, which
# scripts/spec_approval_test.ts asserts on this file: it never checks out,
# fetches, or runs anything of the pull request; event values reach a `run:`
# line only through `env:`; the job alone holds contents: read and
# pull-requests: write; the token is set only on the steps that call gh; no
# secret, no cache, and no action but the checkout and the tool setup with
# Deno alone.
name: spec-labels

on:
  # `pull_request_target` runs with a writable token even for a fork, which a
  # plain `pull_request` run does not have — and a fork cannot be labelled
  # without one, because the setting that grants a fork's own run write access
  # exists for private repositories only. `labeled` and `unlabeled` start the
  # run that records or withdraws the approval; a label written with the
  # workflow's own token starts no run.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

# One group per pull request. A running run finishes; a pending run is replaced
# by a newer one, which decides from the pull request's present state.
concurrency:
  group: spec-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  labels:
    name: spec / labels
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the labels and the approval record comment
    steps:
      # No object authored by the request ever reaches this runner: the
      # checkout is the BASE (the event's default; no ref is named), and the
      # head is read through the REST API by the base's own scripts, which
      # parse it and never execute it. Never add a checkout of the head, a
      # `git fetch` of it, an install from it, or a `run:` of its files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deno only: every tool input of the setup action defaults to off.
      - uses: ./.github/actions/setup-tools
      # First, so that no later step can delay or skip the approval decision.
      # The step's own limit turns a hung script into a failed step, so that
      # the last step runs; the job's limit alone would cancel the job, which
      # runs no step conditioned on failure().
      - name: Decide the approval label
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          # A value, compared with the head the API returns; never checked out.
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/spec_approval.ts --apply
      - name: Snapshot the head through the API
        env:
          # The token reaches only the steps that call the API, so a step
          # added later starts without it and has to ask for it on purpose.
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: ./scripts/spec_changes.ts snapshot --repo "$REPO" --pr "$N" --out "$RUNNER_TEMP/snapshot.json"
      - name: Compute the label plan and apply it
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          CURRENT: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          ./scripts/spec_changes.ts labels --snapshot "$RUNNER_TEMP/snapshot.json" \
            --current "$CURRENT" --json > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          # The plan may only ever name a label of the fixed taxonomy; anything
          # else means the script was tampered with, so the job stops.
          check() {
            case "$1" in
              spec/archived|spec/unarchived|spec/not-started|spec/in-progress|spec/done) ;;
              *) echo "refusing unexpected label: $1" >&2; exit 1 ;;
            esac
          }
          # jq writes both lists before the loops run: fed through a process
          # substitution, a jq failure would read as an empty plan.
          jq -r '.add[]' "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/add.txt"
          jq -r '.remove[]' "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/remove.txt"
          while IFS= read -r label; do
            [ -n "$label" ] || continue
            check "$label"
            gh api -X POST "repos/$REPO/issues/$N/labels" -f "labels[]=$label" > /dev/null
          done < "$RUNNER_TEMP/add.txt"
          while IFS= read -r label; do
            [ -n "$label" ] || continue
            check "$label"
            # Encoded outside the `if` below, so a failure stops the step
            # rather than sending a DELETE for an empty label name.
            encoded=$(jq -rn --arg l "$label" '$l | @uri')
            # A label already absent answers 404, which is not a failure here.
            # Anything else — a permission regression, a rate limit — must fail
            # the job: a silently skipped delete leaves a stale label saying the
            # opposite of the truth, and nothing would prompt a retry.
            if ! err=$(gh api -X DELETE "repos/$REPO/issues/$N/labels/$encoded" 2>&1 >/dev/null); then
              case "$err" in
                *"HTTP 404"*) ;;
                *) printf '%s\n' "$err" >&2; exit 1 ;;
              esac
            fi
          done < "$RUNNER_TEMP/remove.txt"
      # A run that failed or whose deciding step timed out may leave
      # spec/approved where it is wrong; this takes it off, on a closed pull
      # request as well. The maintainer approves again by adding it again. A
      # label that is not there is no failure.
      - name: Remove spec/approved after a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "PR_NUMBER is not a pull request number: '${PR_NUMBER}'" >&2
            exit 1
          fi
          path="repos/${REPO}/issues/${PR_NUMBER}/labels/spec%2Fapproved"
          if ! err="$(gh api -X DELETE "${path}" 2>&1 >/dev/null)"; then
            case "${err}" in
              *"HTTP 404"*) echo "spec/approved was not on the pull request." ;;
              *) printf '%s\n' "${err}" >&2; exit 1 ;;
            esac
          fi
