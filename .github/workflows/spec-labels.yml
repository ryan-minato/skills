# .github/workflows/spec-labels.yml — keeps two label axes on every pull
# request from its related OpenSpec changes: `spec/archived` | `spec/unarchived`
# and `spec/not-started` | `spec/in-progress` | `spec/done`. A pull request
# with no related change carries none of them.
#
# `pull_request_target` runs with a writable token even for a fork, which a
# plain `pull_request` run does not have. The rule that makes that safe: no
# object authored by the request ever reaches this runner. The checkout is the
# BASE (the event's default), and the head is read through the REST API by the
# base's own script, which parses it and never executes it. Never add a
# checkout of the head, a `git fetch` of it, an install from it, or a `run:`
# of its files.
# `scripts/spec_changes.py` is the project's copy of the openspec-workflow
# skill's script.
name: spec-labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: spec-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  labels:
    name: spec / labels
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Snapshot the head through the API
        env:
          N: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python3 scripts/spec_changes.py snapshot --repo "$REPO" --pr "$N" --out "$RUNNER_TEMP/snapshot.json"
      - name: Compute the label plan and apply it
        env:
          N: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          CURRENT: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          python3 scripts/spec_changes.py labels --snapshot "$RUNNER_TEMP/snapshot.json" \
            --current "$CURRENT" --json > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          # The plan may only ever name a label of the fixed taxonomy; anything
          # else means the script was tampered with, so the job stops.
          check() {
            case "$1" in
              spec/archived|spec/unarchived|spec/not-started|spec/in-progress|spec/done) ;;
              *) echo "refusing unexpected label: $1" >&2; exit 1 ;;
            esac
          }
          while IFS= read -r label; do
            [ -n "$label" ] || continue
            check "$label"
            gh api -X POST "repos/$REPO/issues/$N/labels" -f "labels[]=$label" > /dev/null
          done < <(jq -r '.add[]' "$RUNNER_TEMP/plan.json")
          while IFS= read -r label; do
            [ -n "$label" ] || continue
            check "$label"
            gh api -X DELETE "repos/$REPO/issues/$N/labels/$(jq -rn --arg l "$label" '$l | @uri')" > /dev/null || true
          done < <(jq -r '.remove[]' "$RUNNER_TEMP/plan.json")
