# Turns the issue forms' Priority and Catalog answers into labels and clears
# status/needs-triage once a type label and one priority label exist
# (scripts/sync_issue_metadata.ts). Issues have no fork concept, so the token
# is always writable; the script only ever touches managed labels.
name: issue-triage

on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  # true would drop the second of two quick edits.
  cancel-in-progress: false

jobs:
  triage:
    name: issues / triage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Synchronize managed labels from the form answers
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/sync_issue_metadata.ts --event "$GITHUB_EVENT_PATH" --apply
