# The quality gate. Every job mirrors a `just` recipe that exists and
# passes locally; .agents/knowledge/github-checks.md maps jobs to commands.
# The ruleset requires `checks / gate` from this workflow; keep job names
# unique across all workflows and update that file when one changes.
name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSPEC_NO_UPDATE_CHECK: "1"
  DO_NOT_TRACK: "1"

jobs:
  quality:
    name: checks / quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Deno, just, pre-commit, and ruff (latest, as in the dev container)
        uses: ./.github/actions/setup-tools
        with:
          just: "true"
          python-tools: "true"
      - name: Install the repository tools `just install-tools` names
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just install-tools
      - name: Run every repository check
        run: just check

  spec:
    # Path filtering happens inside the job so the gate below still runs on
    # every pull request; an `on.paths` filter would skip the gate too.
    name: checks / spec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        name: Decide whether spec files changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Outside the condition, so a failed diff fails the step instead of
          # reading as "no spec paths changed".
          git diff --name-only "$BASE" "$HEAD" > "$RUNNER_TEMP/changed.txt"
          if grep -Eq '^(openspec/|\.agents/skills/openspec-|\.agents/skills/\.openspec-target|scripts/spec_changes\.ts$|scripts/lib/|deno\.json$|justfile$)' "$RUNNER_TEMP/changed.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No spec-related paths changed; nothing to validate."
          fi
      - if: steps.changed.outputs.run == 'true'
        name: Install Deno and just
        uses: ./.github/actions/setup-tools
        with:
          just: "true"
      - if: steps.changed.outputs.run == 'true'
        name: Install the pinned OpenSpec CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just install-tools
      - if: steps.changed.outputs.run == 'true'
        name: Validate strictly and report an unarchived related change
        # A pull request: strict validation, then a warning for every related
        # change that is still unarchived — waiting for the freeze is a state,
        # not a failure, and `checks / archived` holds the merge until then. A
        # push to main: strict validation, then any change outside archive/
        # fails.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            just spec-check "$BASE" "$HEAD"
          else
            just spec-changes check --all
          fi
      - if: steps.changed.outputs.run == 'true'
        name: Generated OpenSpec skills match the pinned CLI
        run: |
          just spec-sync
          if ! git diff --exit-code --quiet -- .agents/skills; then
            git --no-pager diff --stat -- .agents/skills
            echo "ERROR: .agents/skills/openspec-* differ from what the pinned OpenSpec CLI generates. Run 'just spec-sync' and commit the result." >&2
            exit 1
          fi

  archive-verdict:
    # The archive gate (.agents/knowledge/github-checks.md, `## No standing
    # failure`): decides whether a pull request into the default branch still
    # holds an unarchived related change. Waiting for the freeze is a state,
    # not a failure, so the job succeeds either way and only the carrier
    # below says which; it fails only when the verdict cannot be reached. It
    # runs the BASE's copy of scripts/spec_changes.ts over git objects, so a
    # pull request cannot relax its own verdict by editing the script; the
    # head is fetched, never checked out. Outside the gate: it runs on pull
    # requests only, and ci_gate.ts fails a skipped dependency.
    name: checks / archive-verdict
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      archived: ${{ steps.verdict.outputs.archived }}
    steps:
      - id: branch
        name: Hold only a pull request into the default branch
        # A pull request into another pull request's branch may keep its
        # change open; the request that reaches main archives it.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BASE_REF" = "$DEFAULT_BRANCH" ]; then
            echo "held=true" >> "$GITHUB_OUTPUT"
          else
            echo "The base is not the default branch: the archive gate holds only pull requests into it."
          fi
      - if: steps.branch.outputs.held == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: steps.branch.outputs.held == 'true'
        uses: ./.github/actions/setup-tools
      - if: steps.branch.outputs.held == 'true'
        name: Fetch the pull request head without checking it out
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
      - if: steps.branch.outputs.held == 'true'
        name: List the related changes with the base's script
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          ./scripts/spec_changes.ts status --base "$BASE" --head "$HEAD"
          ./scripts/spec_changes.ts status --base "$BASE" --head "$HEAD" --json > "$RUNNER_TEMP/status.json"
      - id: verdict
        name: Write the verdict
        # Only the literal true or false reaches the job's output; no change
        # name the pull request chose does.
        env:
          HELD: ${{ steps.branch.outputs.held }}
        run: |
          if [ "$HELD" != "true" ]; then
            echo "archived=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          archived="$(jq -r '[.changes[] | select(.state == "active")] | length == 0' "$RUNNER_TEMP/status.json")"
          case "$archived" in
            true | false) echo "archived=${archived}" >> "$GITHUB_OUTPUT" ;;
            *) echo "The status JSON gave no verdict." >&2; exit 1 ;;
          esac

  archived:
    # Carries the required check: it succeeds either way, but under the
    # required name `checks / archived` only when no related change is
    # unarchived. While one is, it reports `checks / awaiting-archive`, which
    # no ruleset requires, so the merge waits on an expected check and the
    # run stays green. A failed verdict skips it: neither name succeeds.
    name: ${{ needs.archive-verdict.outputs.archived == 'true' && 'checks / archived' || 'checks / awaiting-archive' }}
    needs: archive-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          ARCHIVED: ${{ needs.archive-verdict.outputs.archived }}
        run: |
          if [ "$ARCHIVED" = "true" ]; then
            echo "No related change is unarchived, or the base is not the default branch."
          else
            echo "Waiting for the archive; checks / archive-verdict names the unarchived changes."
          fi

  devcontainer:
    # Builds the dev container and runs `just check` inside it when the
    # container, the setup action, the justfile, or deno.json change. Path
    # filtering happens inside the job, as in `spec`, so the gate never sees
    # it skipped.
    name: checks / devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changed
        name: Decide whether the toolchain changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" "$HEAD" > "$RUNNER_TEMP/changed.txt"
          if grep -Eq '^(\.devcontainer/|\.github/actions/setup-tools/|justfile$|deno\.json$)' "$RUNNER_TEMP/changed.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The dev container, setup action, justfile, and deno.json are unchanged; nothing to build."
          fi
      - if: steps.changed.outputs.run == 'true'
        name: Build the dev container and run every check inside it
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          imageName: skills-devcontainer
          push: never
          env: GITHUB_TOKEN
          runCmd: just check

  gate:
    # The aggregator: the ONLY job name the ruleset requires from this
    # workflow. A skipped job reports success, so scripts/ci_gate.ts fails
    # on a failed, cancelled, or skipped dependency and names it.
    name: checks / gate
    if: always()
    needs: [quality, spec, devcontainer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: All required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: ./scripts/ci_gate.ts
