# Archives every completed OpenSpec change after a merge to main:
# scripts/archive_completed_changes.py (a mirror of the spec-driven-development
# skill's script) moves each change whose tasks are all ticked under
# openspec/changes/archive/, merges its delta into openspec/specs/, and
# validates strictly. Runs one at a time and never cancels a run in
# progress; a rejected push fails without retry because the merge that moved
# main triggered the run that archives whatever remains. The push needs the
# GitHub Actions identity on the `Default` ruleset's bypass list
# (.agents/knowledge/github-settings.md); until it is granted, changes are
# archived inside the pull request instead (.agents/knowledge/spec-workflow.md).
name: spec-archive

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: spec-archive
  cancel-in-progress: false

env:
  OPENSPEC_NO_UPDATE_CHECK: "1"
  DO_NOT_TRACK: "1"

jobs:
  archive:
    name: spec-archive / archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install check tools (pins match the dev container and pre-commit)
        run: python3 -m pip install --quiet rust-just==1.58.0
      - name: Install pinned repository tools
        run: just install-tools
      - name: Archive completed changes and validate
        # Pushes made with GITHUB_TOKEN trigger no further workflows, so the
        # strict validator runs here, inside the script.
        run: just spec-archive-completed
      - name: Commit and push
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain openspec)" ]; then
            echo "nothing to archive"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openspec
          git commit -m "docs: archive completed OpenSpec changes"
          if ! git push origin HEAD:main; then
            echo "::error::push to main rejected: grant the Actions identity a bypass on the Default ruleset (.agents/knowledge/github-settings.md) or archive inside the pull request; if main simply moved, the next run archives the rest"
            exit 1
          fi
