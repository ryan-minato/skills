# .github/workflows/spec-archive.yml — archives every completed OpenSpec
# change after a merge to the default branch. Produce it only under a
# specification contract that records OpenSpec and the automated archive
# mode; other spec tools have no fixed archive operation and get a job
# designed with the user instead. Before shipping: verify the CLI's
# non-interactive archive flag from its help, copy this builder's
# `scripts/archive_completed_changes.py` into the project's scripts/ (stdlib
# Python; it reads tasks.md itself and honors `skip_specs: true`), point the
# install step at the project's version pin, and record the push path in
# platform-settings.md as a maintainer action — until it exists, in-request
# archiving stays in force:
#   organization-owned repository: the GitHub Actions app as a bypass actor
#     on the default branch's ruleset; keep the plain checkout below.
#     GITHUB_TOKEN pushes trigger no further workflows, so this job runs the
#     strict validator itself.
#   user-owned repository: the API refuses the Actions app; check out with a
#     deploy key that has write access (`ssh-key` on the checkout step, the
#     private key a repository secret) or push with a GitHub App installation
#     token minted in the job. Pushes made that way trigger workflows,
#     including this one, whose second run finds nothing completed and exits 0.
name: spec-archive

on:
  push:
    branches: ["{{DEFAULT_BRANCH}}"]

# The archive commits to the default branch, so this is the one workflow
# that writes contents. Everything else stays deny-by-default.
permissions:
  contents: write

# One archive run at a time, never cancelling one in progress: a second
# merge queues its run, which then rescans everything still completed.
concurrency:
  group: spec-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@{{PINNED_SHA}}"
        with:
          ref: "{{DEFAULT_BRANCH}}"
          # user-owned repository with a deploy key: add
          #   ssh-key: ${{ secrets.{{DEPLOY_KEY_SECRET}} }}
      - uses: "actions/setup-node@{{PINNED_SHA}}"
        with:
          node-version: "{{NODE_LTS}}"
      - name: Install the pinned OpenSpec CLI
        run: "{{INSTALL_COMMAND — e.g. just install-tools, reading the project's single version pin}}"
      - name: Archive completed changes
        # Archives every change whose tasks are all ticked (spec-less changes
        # without touching the main specs), then runs the strict validator
        # itself.
        run: python3 scripts/archive_completed_changes.py
      - name: Commit and push
        # Exit 0 with no diff when nothing was archived. Never rebase or
        # retry a rejected push: the merge that moved the branch triggered
        # the run that archives whatever remains.
        run: |
          if git diff --quiet; then
            echo "nothing to archive"
            exit 0
          fi
          git config user.name "{{BOT_NAME — github-actions[bot] under the Actions app}}"
          git config user.email "{{BOT_NOREPLY_EMAIL — 41898282+github-actions[bot]@users.noreply.github.com under the Actions app}}"
          git add openspec
          git commit -m "{{COMMIT_SUBJECT — per the project's commit convention, e.g. "chore(spec): archive completed changes"}}"
          git push origin HEAD:{{DEFAULT_BRANCH}}
