# .github/workflows/policy-check.yml — credential-free checks of
# .github/policy.tf: format and validation against the committed provider
# lock. No secret and no write permission: an administrator plans and applies
# locally through the task-runner recipes, and review is the check on what the
# file declares. Runs only when the tf files change; when this job is a
# required check, the paths filter and the aggregator gate must agree, or a
# skipped run reads as a vacuous pass.
name: policy-check

on:
  pull_request:
    paths:
      - ".github/policy.tf"
      - ".github/.terraform.lock.hcl"
  push:
    branches: ["{{DEFAULT_BRANCH}}"]
    paths:
      - ".github/policy.tf"
      - ".github/.terraform.lock.hcl"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy / check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github
    steps:
      - uses: actions/checkout@v4
      # OpenTofu from its official release, checked against the release's
      # SHA256SUMS; no third-party action. A Terraform project downloads from
      # releases.hashicorp.com the same way and runs `terraform` below.
      - name: Install OpenTofu {{TOFU_VERSION}}
        env:
          TOFU_VERSION: "{{TOFU_VERSION}}"
        run: |
          base="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}"
          zip="tofu_${TOFU_VERSION}_linux_amd64.zip"
          curl --proto '=https' --tlsv1.2 -fsSLO "$base/$zip"
          curl --proto '=https' --tlsv1.2 -fsSL -o SHA256SUMS "$base/tofu_${TOFU_VERSION}_SHA256SUMS"
          grep " ${zip}\$" SHA256SUMS | sha256sum -c -
          unzip -q "$zip" tofu -d "$RUNNER_TEMP/tofu"
          rm "$zip" SHA256SUMS
          echo "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"
      - name: Format
        run: tofu fmt -check -diff policy.tf
      - name: Validate against the committed lock
        run: |
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate
