# .github/workflows/triage.yml — the triage lifecycle for status/* labels.
# Issue events only (issues have no fork concept, so the token is always
# writable). Detection, not prevention: on a second priority/* label it
# COMMENTS rather than silently removing — a hard-removing bot fights
# maintainers who overrode deliberately.
#
# Reads the native issue type and the organization's Priority issue field
# first, falling back to labels where those do not exist. On a personal
# account delete the ORG_PRIORITY_FIELD line and keep the label path; in an
# organization set it to the field's exact name. A form can set the type but
# can never pre-fill a field value, so priority always starts empty here.
name: triage

on:
  issues:
    types: [opened, labeled, unlabeled]

permissions:
  issues: write

concurrency:
  group: triage-${{ github.event.issue.number }}
  # cancel-in-progress: true would drop the second label event entirely.
  cancel-in-progress: false

jobs:
  lifecycle:
    name: triage / lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ORG_PRIORITY_FIELD = '{{PRIORITY_FIELD_NAME_OR_EMPTY}}';
            const labels = (context.payload.issue.labels || []).map((l) => l.name);
            const issue_number = context.payload.issue.number;
            const { owner, repo } = context.repo;

            // Native type wins; the label list is the personal-account fallback.
            const TYPES = ['bug', 'enhancement', 'documentation', 'task'];
            const hasType = Boolean(context.payload.issue.type)
              || labels.some((n) => TYPES.includes(n));

            // Same for priority: the org field first, priority/* labels after.
            const priorities = labels.filter((n) => n.startsWith('priority/'));
            let hasPriority = priorities.length === 1;
            if (ORG_PRIORITY_FIELD) {
              try {
                const { data } = await github.request(
                  'GET /repos/{owner}/{repo}/issues/{issue_number}/issue-field-values',
                  { owner, repo, issue_number },
                );
                // The endpoint returns a bare array; each entry names its
                // field in issue_field_name, and a single-select answer
                // arrives in single_select_option, not in `value`.
                const values = Array.isArray(data) ? data : [];
                hasPriority = values.some((v) => {
                  if (v.issue_field_name !== ORG_PRIORITY_FIELD) return false;
                  if (v.single_select_option) return true;
                  if (Array.isArray(v.multi_select_options)) {
                    return v.multi_select_options.length > 0;
                  }
                  return v.value !== null && v.value !== undefined && v.value !== '';
                });
              } catch (error) {
                // Field values are unreadable on a personal account or an
                // older GHES; the label fallback already answered.
                if (error.status !== 404 && error.status !== 403) throw error;
              }
            }

            if (context.payload.action === 'labeled' && priorities.length > 1) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: 'This issue carries more than one priority label ('
                  + priorities.join(', ')
                  + '). The convention is exactly one `priority/*`; please remove the one that no longer applies.',
              });
            }

            const triaged = hasType && hasPriority;
            const hasNeedsTriage = labels.includes('status/needs-triage');
            if (triaged && hasNeedsTriage) {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number, name: 'status/needs-triage',
                });
              } catch (error) {
                // A concurrent update may already have removed the label.
                if (error.status !== 404) throw error;
              }
            } else if (!triaged && !hasNeedsTriage && context.payload.action === 'opened') {
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: ['status/needs-triage'],
              });
            }
