# .github/ISSUE_TEMPLATE/01-bug.yml — rework every field for the project.
# The `labels:` values must exist in the repository or they are dropped
# silently.
# The `type:` key applies the native issue type; delete it on a personal
# account, where issue types do not exist, and add the type label to
# `labels:` instead.
name: Bug report
description: "{{PROJECT_NAME}} behaves differently from its intended design"
labels: ["status/needs-triage"]
type: Bug
body:
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: The observed behavior, exactly. Paste output rather than paraphrasing it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: The intended behavior. Together with the field above this is the acceptance baseline for the fix.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Smallest known sequence of steps, commands, or input.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and references
      description: "Version or commit, environment, related issues or PRs, logs. {{PROJECT_SPECIFIC_CONTEXT_HINT}}"
    validations:
      required: false
