# .github/ISSUE_TEMPLATE/02-feature.yml — rework every field for the
# project. Labels must exist or they are dropped silently.
# The `type:` key applies the native issue type; delete it on a personal
# account, where issue types do not exist, and add the type label to
# `labels:` instead.
name: Feature request
description: "Propose a new capability for {{PROJECT_NAME}}"
labels: ["status/needs-triage"]
type: Feature
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What becomes possible, and for whom, when this exists.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and references
      description: Why now — prior discussion, alternatives considered, links.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance sketch
      description: How we would observe that this is done. Rough is fine; triage refines it.
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this request deliberately does not cover.
    validations:
      required: false
