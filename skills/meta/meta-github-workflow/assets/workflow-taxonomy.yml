# .github/workflows/taxonomy.yml — runs the committed taxonomy checker so a
# label or issue type referenced by an issue form, release.yml, or the
# labeler but absent from the committed taxonomy fails the pull request
# instead of being dropped silently at runtime. Runs only when one of those files changes; the paths filter and
# the aggregator gate must agree, or a skipped run reads as a vacuous pass.
name: taxonomy

on:
  pull_request:
    paths:
      - ".github/labels.json"
      - ".github/org-taxonomy.json"
      - ".github/release.yml"
      - ".github/labeler.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - "scripts/check_taxonomy.py"
  push:
    branches: ["{{DEFAULT_BRANCH}}"]
    paths:
      - ".github/labels.json"
      - ".github/org-taxonomy.json"
      - ".github/release.yml"
      - ".github/labeler.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - "scripts/check_taxonomy.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  taxonomy:
    name: taxonomy / consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The checker declares PyYAML in its PEP 723 header, and `uv run`
      # installs what the header declares. uv comes from PyPI at a pinned
      # release, so no third-party action joins the workflow.
      - name: Install uv
        run: python3 -m pip install "uv=={{UV_VERSION}}"
      - name: Check the taxonomy
        run: uv run scripts/check_taxonomy.py
