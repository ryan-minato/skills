# One named state of the configuration surface (schema: config.py): only
# the values the schema leaves unset or marks MISSING.
data:
  train: "<immutable identity>"
  eval: "<evaluation set identity>"
model:
  name: "<named choice>"
optim:
  name: "<named choice>"
  lr: <learning rate>
  max_grad_norm: <clipping bound>
run:
  steps: <optimizer steps>
