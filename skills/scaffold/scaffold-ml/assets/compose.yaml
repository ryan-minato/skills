services:
  train:
    build:
      context: .
      target: runtime
    environment:
      IMAGE_DIGEST: "${IMAGE_DIGEST:-}"   # export from `just docker-digest` or the pushed digest
    volumes:
      - .:/app                             # the source, at run time
      - ./data:/app/data
      - ./outputs:/app/outputs
      - hf-cache:/root/.cache/huggingface
    env_file: .env  # secrets ride in at runtime, never into the image
    shm_size: "<e.g. 8gb>"  # DataLoader workers exhaust Docker's default shm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
