# .github/workflows/spec-archive.yml — archives a pull request's completed
# OpenSpec changes inside the pull request when the `spec/archive` label is
# applied (applying a label needs triage access, which is the invocation
# gate). Same-repository branch: the job checks the head out, archives every
# related change whose tasks are all ticked (refusing all of them when any
# has an open task), validates strictly, commits as the Actions bot, pushes
# to the branch, recomputes the status labels, removes the trigger label, and
# posts a summary. Fork: the job pushes nothing; it posts the commands the
# author runs locally, and removes the label. A pull request that is not
# open gets a note only.
#
# The push uses the platform token, so the `pull_request` runs it causes sit in
# an approval-required state until a user with write access clicks
# "Approve workflows to run" in the merge box; the summary says so. A rejected
# push (the branch moved during the run) fails without retry.
#
# `pull_request_target` runs with a writable token; every script and the CLI
# install come from the BASE checkout in `base/`. The head is checked out into
# `pr/` only under a literal `head.repo.full_name == github.repository`
# condition, because such a branch lives in this repository and its code
# already runs in the project's own CI. A fork's head is never fetched into
# the runner's git store: it is read through the REST API by the base's own
# script, which parses it and never executes it.
#
# The token reaches only the steps that call the API or push: no checkout
# persists credentials, the CLI is installed before the head is checked out
# and runs in a step without the token, and the push authenticates through
# a one-shot header. Third-party install and CLI code therefore never sees
# the token in its environment or on disk.
# Replace every {{PLACEHOLDER}}; `scripts/spec_changes.py` is the project's
# copy of this skill's script; the commit subject follows the project's
# commit convention.
name: spec-archive

on:
  pull_request_target:
    types: [labeled]

permissions: {}

concurrency:
  group: spec-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  OPENSPEC_NO_UPDATE_CHECK: "1"
  DO_NOT_TRACK: "1"

jobs:
  archive:
    name: spec / archive
    if: github.event.label.name == 'spec/archive'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      N: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: "actions/checkout@{{PINNED_SHA}}"
        with:
          path: base
          persist-credentials: false
      - name: Note a pull request that is not open
        if: github.event.pull_request.state != 'open'
        run: |
          printf 'This pull request is not open: nothing was archived. Archive on a new branch.\n' > "$RUNNER_TEMP/summary.md"
      - name: Fork — post the commands instead of pushing
        if: >-
          github.event.pull_request.state == 'open'
          && github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 base/scripts/spec_changes.py snapshot --repo "$REPO" --pr "$N" --out "$RUNNER_TEMP/snapshot.json"
          {
            printf '@%s this pull request comes from a fork, so the bot cannot push to it. Archive locally:\n\n' "$AUTHOR"
            printf '```bash\n# `upstream` is this repository; a fork clone'"'"'s `origin` is the fork.\ngit fetch upstream %s\n%s\npython3 scripts/spec_changes.py archive --base upstream/%s --head HEAD\n%s\ngit add openspec\ngit commit -m "%s"\ngit push\n```\n\n' \
              "$BASE_REF" "{{INSTALL_COMMAND}}" "$BASE_REF" "{{VALIDATE_COMMAND}}" "{{ARCHIVE_COMMIT_SUBJECT}}"
            printf 'Current state of the related changes:\n\n'
            python3 base/scripts/spec_changes.py status --snapshot "$RUNNER_TEMP/snapshot.json"
          } > "$RUNNER_TEMP/summary.md"
      - uses: "actions/setup-node@{{PINNED_SHA}}"
        if: >-
          github.event.pull_request.state == 'open'
          && github.event.pull_request.head.repo.full_name == github.repository
        with:
          node-version: "{{NODE_LTS}}"
      - name: Install the pinned OpenSpec CLI from the base
        if: >-
          github.event.pull_request.state == 'open'
          && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: base
        run: "{{INSTALL_COMMAND}}"
      - uses: "actions/checkout@{{PINNED_SHA}}"
        if: >-
          github.event.pull_request.state == 'open'
          && github.event.pull_request.head.repo.full_name == github.repository
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - id: archive
        name: Archive and commit locally
        if: >-
          github.event.pull_request.state == 'open'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # fetch-depth 0 fetched every branch, so origin/$BASE_REF is present.
          tip=$(git -C pr rev-parse HEAD)
          [ "$tip" = "$EVENT_HEAD" ] \
            || printf 'The branch moved after the label was applied; the latest tip %s was archived.\n\n' "$tip" > "$RUNNER_TEMP/moved.md"
          if ! python3 base/scripts/spec_changes.py --root pr archive --base "origin/$BASE_REF" --head HEAD --json \
              > "$RUNNER_TEMP/plan.json" 2> "$RUNNER_TEMP/archive.err"; then
            {
              printf 'Nothing archived — every related change must be complete first:\n\n```\n'
              cat "$RUNNER_TEMP/archive.err"
              printf '```\n'
            } > "$RUNNER_TEMP/summary.md"
            exit 1
          fi
          names=$(jq -r '.archived | join(", ")' "$RUNNER_TEMP/plan.json")
          if [ -z "$names" ]; then
            printf 'Nothing to archive: every related change is already archived or removed.\n' > "$RUNNER_TEMP/summary.md"
            exit 0
          fi
          subject=$(jq -r '.archived | if length == 1 then "{{ARCHIVE_COMMIT_PREFIX}} archive the \(.[0]) change"
            elif length == 2 then "{{ARCHIVE_COMMIT_PREFIX}} archive the \(.[0]) and \(.[1]) changes"
            else "{{ARCHIVE_COMMIT_PREFIX}} archive the \(.[:-1] | join(", ")), and \(.[-1]) changes" end' "$RUNNER_TEMP/plan.json")
          git -C pr config user.name "github-actions[bot]"
          git -C pr config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pr add openspec
          git -C pr commit -q -m "$subject"
          echo "commit=true" >> "$GITHUB_OUTPUT"
      - name: Push and relabel
        if: steps.archive.outputs.commit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          basic=$(printf '%s:%s' x-access-token "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          if ! GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" git -C pr push origin "HEAD:$HEAD_REF"; then
            printf 'The archive commit could not be pushed: the branch moved during the run. Push your work, then apply `spec/archive` again.\n' > "$RUNNER_TEMP/summary.md"
            exit 1
          fi
          count=$(jq -r '.archived | length' "$RUNNER_TEMP/plan.json")
          names=$(jq -r '.archived | join(", ")' "$RUNNER_TEMP/plan.json")
          sha=$(git -C pr rev-parse HEAD)
          python3 base/scripts/spec_changes.py --root pr labels --base "origin/$BASE_REF" --head HEAD --current "$CURRENT" --json \
            > "$RUNNER_TEMP/labels.json"
          for label in $(jq -r '.add[]' "$RUNNER_TEMP/labels.json"); do
            gh api -X POST "repos/$REPO/issues/$N/labels" -f "labels[]=$label" > /dev/null
          done
          for label in $(jq -r '.remove[]' "$RUNNER_TEMP/labels.json"); do
            gh api -X DELETE "repos/$REPO/issues/$N/labels/$(jq -rn --arg l "$label" '$l | @uri')" > /dev/null || true
          done
          {
            printf 'Archived %s change(s) in %s: %s.\n\n' "$count" "$sha" "$names"
            [ ! -s "$RUNNER_TEMP/moved.md" ] || cat "$RUNNER_TEMP/moved.md"
            printf 'A user with write access must click **Approve workflows to run** in the merge box for the checks to run on this commit. '
            printf 'The `Spec:` link in the description may now point at the archive directory of each change.\n'
          } > "$RUNNER_TEMP/summary.md"
      - name: Remove the trigger label and post the summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$REPO/issues/$N/labels/spec%2Farchive" > /dev/null || true
          [ -s "$RUNNER_TEMP/summary.md" ] || printf 'The archive run ended before it could report; see the workflow log.\n' > "$RUNNER_TEMP/summary.md"
          gh pr comment "$N" --repo "$REPO" --body-file "$RUNNER_TEMP/summary.md"
