# .github/workflows/spec-command.yml — answers `/spec` commands posted as
# pull request comments: `/spec show [<change>] [proposal|design|tasks|specs|all]`,
# `/spec status [<change>]`, `/spec help`. An `issue_comment` run uses the
# workflow file and the checkout of the DEFAULT branch, so every script comes
# from there; the pull request's head is read through the REST API, never
# fetched into the runner's git store, checked out, installed, or executed —
# which is what makes the job safe for pull requests from forks. Only a
# collaborator (owner, member, collaborator) may invoke it: the job spends a
# privileged run and a slice of the repository's shared API budget, so an
# outside contributor cannot start one on their own request. Replies are posted with the platform token, whose comments start
# no workflow run, so the job cannot loop. Replace {{PINNED_SHA}} with the
# checkout action's pinned commit; `scripts/spec_changes.py` is the project's
# copy of this skill's script.
name: spec-command

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: spec-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  command:
    name: spec / command
    if: >-
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/spec')
      && github.event.comment.user.type != 'Bot'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The reply is an issue comment; reading the request and its files is a
      # pull-request read, and every permission left out of this block is none.
      pull-requests: read
      issues: write
    steps:
      - uses: "actions/checkout@{{PINNED_SHA}}"
      - id: pr
        name: Resolve the pull request and snapshot its head through the API
        env:
          # The token reaches only the two steps that call the API, so a step
          # added later starts without it and has to ask for it on purpose.
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr view "$N" --repo "$REPO" --json headRefOid,state > "$RUNNER_TEMP/pr.json"
          {
            echo "head=$(jq -r .headRefOid "$RUNNER_TEMP/pr.json")"
            echo "state=$(jq -r .state "$RUNNER_TEMP/pr.json")"
          } >> "$GITHUB_OUTPUT"
          python3 scripts/spec_changes.py snapshot --repo "$REPO" --pr "$N" --out "$RUNNER_TEMP/snapshot.json"
      - name: Run the command and reply
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          HEAD: ${{ steps.pr.outputs.head }}
          STATE: ${{ steps.pr.outputs.state }}
        run: |
          set -f
          line=$(printf '%s\n' "$COMMENT_BODY" | grep -m1 -E '^/spec( |$)' || true)
          set -- $line
          shift
          cmd="${1:-help}"
          [ $# -gt 0 ] && shift
          note=""
          [ "$STATE" = "OPEN" ] || note=" (pull request is $STATE)"
          {
            # Backticks are dropped so the echoed command stays inside its code span.
            printf '`/spec %s` — head `%s`%s\n\n' "$(echo "$cmd $*" | tr -d '`' | sed 's/ *$//')" "${HEAD:0:7}" "$note"
            case "$cmd" in
              show)
                change=""; doc="all"
                for a in "$@"; do
                  case "$a" in proposal|design|tasks|specs|all) doc="$a" ;; *) change="$a" ;; esac
                done
                python3 scripts/spec_changes.py show --snapshot "$RUNNER_TEMP/snapshot.json" \
                  ${change:+--change "$change"} --doc "$doc" \
                  --url-prefix "https://github.com/$REPO/blob/$HEAD" --max-chars 60000
                ;;
              status)
                python3 scripts/spec_changes.py status --snapshot "$RUNNER_TEMP/snapshot.json" ${1:+--change "$1"}
                ;;
              *)
                printf 'Commands: `/spec show [<change>] [proposal|design|tasks|specs|all]`, `/spec status [<change>]`, `/spec help`.\n'
                ;;
            esac
          } > "$RUNNER_TEMP/reply.md" 2>&1 || true
          gh pr comment "$N" --repo "$REPO" --body-file "$RUNNER_TEMP/reply.md"
