# GitLab CI jobs for OpenSpec changes in merge requests. Include this file
# from the project's `.gitlab-ci.yml` (`include: - local: ...`) or paste the
# jobs in; add the `spec` stage or rename the stage below. Replace every
# {{PLACEHOLDER}}: the image or the install command for the pinned OpenSpec
# CLI. `scripts/spec_changes.py` is the project's copy of this skill's
# script. No job here writes to the repository: archiving is the
# implementer's command, run once the deliberation closes.
#
# What GitLab does not offer, stated plainly: no pipeline source exists for
# a merge request note or a label change, so nothing here runs until the
# next pipeline (a push, the "Run pipeline" button, or the `/run_pipeline`
# quick action on GitLab 18.7 and later); manual jobs read no chat
# arguments. Merge request pipelines from a fork run in the fork without
# the parent's variables, so labels and notes work for a fork only when a
# parent-project member runs the pipeline in the parent context.

variables:
  GIT_DEPTH: "0"
  OPENSPEC_NO_UPDATE_CHECK: "1"
  DO_NOT_TRACK: "1"

.spec-base:
  image: "{{NODE_IMAGE}}"
  stage: spec
  before_script:
    - "{{INSTALL_COMMAND}}"
    - export SPEC_BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA" SPEC_HEAD="$CI_COMMIT_SHA"
    - export SPEC_FORK="$([ "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" != "$CI_MERGE_REQUEST_PROJECT_ID" ] && echo true || echo false)"
    - export SPEC_API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID"

# Fails the pipeline on an invalid structure or, once the merge request is
# no longer a draft, on an unarchived related change. Enforce with the
# project setting "Pipelines must succeed" (a maintainer action).
spec:check:
  extends: .spec-base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        flag=""
        case "$CI_MERGE_REQUEST_TITLE" in Draft:*|WIP:*) flag="--draft" ;; esac
        # {{REQUEST_SHAPE}} is `combined` or `split`, from the contract; only
        # the split shape's specification request may merge unimplemented.
        python3 scripts/spec_changes.py check --base "$SPEC_BASE" --head "$SPEC_HEAD" $flag --shape {{REQUEST_SHAPE}}
      else
        python3 scripts/spec_changes.py check --all
      fi

# Manual: prints a change's documents (SPEC_CHANGE empty = every related
# change; SPEC_DOC = proposal|design|tasks|specs|all) to the job log, and
# posts them as a merge request note when SPEC_NOTE_TOKEN (api scope) is
# set. A manual job reads no chat arguments, so these come from its
# variables form.
spec:show:
  extends: .spec-base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  variables:
    SPEC_CHANGE: ""
    SPEC_DOC: "all"
  script:
    - |
      python3 scripts/spec_changes.py show --base "$SPEC_BASE" --head "$SPEC_HEAD" \
        ${SPEC_CHANGE:+--change "$SPEC_CHANGE"} --doc "$SPEC_DOC" \
        --url-prefix "$CI_PROJECT_URL/-/blob/$CI_COMMIT_SHA" --max-chars 60000 | tee reply.md
      if [ -n "$SPEC_NOTE_TOKEN" ]; then
        jq -Rs '{body: .}' reply.md > note.json
        curl --fail --silent --header "PRIVATE-TOKEN: $SPEC_NOTE_TOKEN" --header "Content-Type: application/json" \
          --data @note.json "$SPEC_API/notes" > /dev/null
      fi

# Manual: the progress table, same note behavior.
spec:status:
  extends: .spec-base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  variables:
    SPEC_CHANGE: ""
  script:
    - |
      python3 scripts/spec_changes.py status --base "$SPEC_BASE" --head "$SPEC_HEAD" \
        ${SPEC_CHANGE:+--change "$SPEC_CHANGE"} | tee reply.md
      if [ -n "$SPEC_NOTE_TOKEN" ]; then
        jq -Rs '{body: .}' reply.md > note.json
        curl --fail --silent --header "PRIVATE-TOKEN: $SPEC_NOTE_TOKEN" --header "Content-Type: application/json" \
          --data @note.json "$SPEC_API/notes" > /dev/null
      fi

# Keeps the two status-label axes; with SPEC_LABELS_TOKEN (api scope) it
# applies them, otherwise it only prints the plan. A label it applies
# appears only after the next pipeline, because no pipeline source exists
# for a label change.
spec:labels:
  extends: .spec-base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true
  script:
    - |
      python3 scripts/spec_changes.py labels --base "$SPEC_BASE" --head "$SPEC_HEAD" --current "$CI_MERGE_REQUEST_LABELS" --json | tee plan.json
      if [ -n "$SPEC_LABELS_TOKEN" ]; then
        add=$(jq -r '.add | join(",")' plan.json); remove=$(jq -r '.remove | join(",")' plan.json)
        curl --fail --silent --request PUT --header "PRIVATE-TOKEN: $SPEC_LABELS_TOKEN" \
          --data-urlencode "add_labels=$add" --data-urlencode "remove_labels=$remove" "$SPEC_API" > /dev/null
      else
        echo "SPEC_LABELS_TOKEN is not set: plan printed, labels unchanged."
      fi
