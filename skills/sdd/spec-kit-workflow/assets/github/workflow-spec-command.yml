# .github/workflows/spec-command.yml — answers `/spec` commands posted as
# pull request comments: `/spec show [<feature>] [spec|plan|tasks|all]`,
# `/spec status [<feature>]`, `/spec help`. An `issue_comment` run uses the
# workflow file and the checkout of the DEFAULT branch, so every script comes
# from there; the pull request's head is fetched as git objects only and read
# by the script, never checked out, installed, or executed — which is what
# makes the job safe for pull requests from forks. Only a collaborator
# (owner, member, collaborator) or the pull request's author may invoke it.
# Replies are posted with the platform token, whose comments start no
# workflow run, so the job cannot loop. Replace {{PINNED_SHA}} with the
# checkout action's pinned commit; `scripts/spec_kit_features.py` is the project's
# copy of this skill's script.
name: spec-command

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: spec-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  command:
    name: spec / command
    if: >-
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/spec')
      && github.event.comment.user.type != 'Bot'
      && (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          || github.event.comment.user.login == github.event.issue.user.login)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: "actions/checkout@{{PINNED_SHA}}"
        with:
          fetch-depth: 0
      - id: pr
        name: Resolve the pull request and fetch its head as objects
        env:
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr view "$N" --repo "$REPO" --json headRefOid,baseRefName,state > "$RUNNER_TEMP/pr.json"
          head=$(jq -r .headRefOid "$RUNNER_TEMP/pr.json")
          base=$(jq -r .baseRefName "$RUNNER_TEMP/pr.json")
          {
            echo "head=$head"
            echo "base=$base"
            echo "state=$(jq -r .state "$RUNNER_TEMP/pr.json")"
          } >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin "+refs/pull/$N/head:refs/remotes/pr/$N" "+refs/heads/$base:refs/remotes/origin/$base"
      - name: Run the command and reply
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          HEAD: ${{ steps.pr.outputs.head }}
          BASE: ${{ steps.pr.outputs.base }}
          STATE: ${{ steps.pr.outputs.state }}
        run: |
          set -f
          line=$(printf '%s\n' "$COMMENT_BODY" | grep -m1 -E '^/spec( |$)' || true)
          set -- $line
          shift
          cmd="${1:-help}"
          [ $# -gt 0 ] && shift
          note=""
          [ "$STATE" = "OPEN" ] || note=" (pull request is $STATE)"
          {
            printf '`/spec %s` — head `%s`%s\n\n' "$(echo "$cmd $*" | sed 's/ *$//')" "${HEAD:0:7}" "$note"
            case "$cmd" in
              show)
                feature=""; doc="all"
                for a in "$@"; do
                  case "$a" in spec|plan|tasks|all) doc="$a" ;; *) feature="$a" ;; esac
                done
                python3 scripts/spec_kit_features.py show --base "origin/$BASE" --head "pr/$N" \
                  ${feature:+--feature "$feature"} --doc "$doc" \
                  --url-prefix "https://github.com/$REPO/blob/$HEAD" --max-chars 60000
                ;;
              status)
                python3 scripts/spec_kit_features.py status --base "origin/$BASE" --head "pr/$N" ${1:+--feature "$1"}
                ;;
              *)
                printf 'Commands: `/spec show [<feature>] [spec|plan|tasks|all]`, `/spec status [<feature>]`, `/spec help`.\n'
                ;;
            esac
          } > "$RUNNER_TEMP/reply.md" 2>&1 || true
          gh pr comment "$N" --repo "$REPO" --body-file "$RUNNER_TEMP/reply.md"
