# GitLab CI jobs for Spec-Kit features in merge requests. Include this file
# from the project's `.gitlab-ci.yml` (`include: - local: ...`) or paste the
# jobs in; add the `spec` stage or rename the stage below. Replace
# {{PYTHON_IMAGE}}. `scripts/spec_kit_features.py` is the project's copy of
# this skill's script. No job here writes to the repository.
#
# What GitLab does not offer, stated plainly: no pipeline source exists for
# a merge request note or a label change, so a label a job applies appears
# only after the next pipeline runs, and manual jobs read no chat arguments.
# Merge request pipelines from a fork run in the fork without the parent's
# variables, so notes and labels work for a fork only when a parent-project
# member runs the pipeline in the parent context.

variables:
  GIT_DEPTH: "0"

.spec-base:
  image: "{{PYTHON_IMAGE}}"
  stage: spec
  before_script:
    - export SPEC_BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA" SPEC_HEAD="$CI_COMMIT_SHA"
    - export SPEC_API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID"

# Fails the pipeline when a touched feature is missing its specification or
# plan and, once the merge request is no longer a draft, when a task of a
# touched feature is still open — Spec-Kit has no archive operation, so this
# is what completion means. Enforce with the project setting "Pipelines must
# succeed" (a maintainer action).
spec:check:
  extends: .spec-base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        flag=""
        case "$CI_MERGE_REQUEST_TITLE" in Draft:*|WIP:*) flag="--draft" ;; esac
        # {{REQUEST_SHAPE}} is `combined` or `split`, from the contract; only
        # the split shape's specification request may merge unimplemented.
        python3 scripts/spec_kit_features.py check --base "$SPEC_BASE" --head "$SPEC_HEAD" $flag --shape {{REQUEST_SHAPE}}
      else
        python3 scripts/spec_kit_features.py check --all
      fi

# Manual: prints a feature's documents (SPEC_FEATURE empty = every touched
# feature; SPEC_DOC = spec|plan|tasks|all) to the job log, and posts them as a
# merge request note when SPEC_NOTE_TOKEN (api scope, masked) is set. A manual
# job reads no chat arguments, so these come from its variables form.
spec:show:
  extends: .spec-base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  variables:
    SPEC_FEATURE: ""
    SPEC_DOC: "all"
  script:
    - |
      python3 scripts/spec_kit_features.py show --base "$SPEC_BASE" --head "$SPEC_HEAD" \
        ${SPEC_FEATURE:+--feature "$SPEC_FEATURE"} --doc "$SPEC_DOC" \
        --url-prefix "$CI_PROJECT_URL/-/blob/$CI_COMMIT_SHA" --max-chars 60000 | tee reply.md
      if [ -n "$SPEC_NOTE_TOKEN" ]; then
        jq -Rs '{body: .}' reply.md > note.json
        curl --fail --silent --header "PRIVATE-TOKEN: $SPEC_NOTE_TOKEN" --header "Content-Type: application/json" \
          --data @note.json "$SPEC_API/notes" > /dev/null
      fi

# Manual: the progress table, same note behavior.
spec:status:
  extends: .spec-base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  variables:
    SPEC_FEATURE: ""
  script:
    - |
      python3 scripts/spec_kit_features.py status --base "$SPEC_BASE" --head "$SPEC_HEAD" \
        ${SPEC_FEATURE:+--feature "$SPEC_FEATURE"} | tee reply.md
      if [ -n "$SPEC_NOTE_TOKEN" ]; then
        jq -Rs '{body: .}' reply.md > note.json
        curl --fail --silent --header "PRIVATE-TOKEN: $SPEC_NOTE_TOKEN" --header "Content-Type: application/json" \
          --data @note.json "$SPEC_API/notes" > /dev/null
      fi

# Keeps the progress label; with SPEC_LABELS_TOKEN (api scope) it applies it,
# otherwise it only prints the plan. A label a job applies appears only after
# the next pipeline, because no pipeline source exists for a label change.
spec:labels:
  extends: .spec-base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true
  script:
    - |
      python3 scripts/spec_kit_features.py labels --base "$SPEC_BASE" --head "$SPEC_HEAD" --current "$CI_MERGE_REQUEST_LABELS" --json | tee plan.json
      if [ -n "$SPEC_LABELS_TOKEN" ]; then
        add=$(jq -r '.add | join(",")' plan.json); remove=$(jq -r '.remove | join(",")' plan.json)
        curl --fail --silent --request PUT --header "PRIVATE-TOKEN: $SPEC_LABELS_TOKEN" \
          --data-urlencode "add_labels=$add" --data-urlencode "remove_labels=$remove" "$SPEC_API" > /dev/null
      else
        echo "SPEC_LABELS_TOKEN is not set: plan printed, labels unchanged."
      fi
